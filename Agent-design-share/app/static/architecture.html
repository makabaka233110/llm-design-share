<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>系统架构图</title>
<style>
body { margin: 0; padding: 40px; background: #fff; font-family: -apple-system, "Segoe UI", sans-serif; }
h2 { text-align: center; margin-bottom: 30px; color: #1a1a2e; }
</style>
</head>
<body>
<h2>面壁 —— AI 面试修炼系统架构图</h2>
<svg viewBox="0 0 1100 720" xmlns="http://www.w3.org/2000/svg" style="max-width:1100px;margin:0 auto;display:block">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#555"/></marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#667eea"/></marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#11998e"/></marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#e94560"/></marker>
    <filter id="shadow"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#667eea"/><stop offset="100%" stop-color="#764ba2"/></linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#11998e"/><stop offset="100%" stop-color="#38ef7d"/></linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f093fb"/><stop offset="100%" stop-color="#f5576c"/></linearGradient>
    <linearGradient id="gYellow" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f6d365"/><stop offset="100%" stop-color="#fda085"/></linearGradient>
  </defs>

  <!-- ═══ 知识入库流程 (顶部) ═══ -->
  <text x="30" y="30" font-size="14" font-weight="bold" fill="#667eea">A. 知识入库流程</text>

  <!-- 用户粘贴 -->
  <rect x="30" y="45" width="130" height="50" rx="8" fill="url(#gBlue)" filter="url(#shadow)"/>
  <text x="95" y="67" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">用户粘贴</text>
  <text x="95" y="82" text-anchor="middle" fill="#ddd" font-size="10">面经/笔记</text>

  <!-- → -->
  <line x1="160" y1="70" x2="200" y2="70" stroke="#667eea" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Markdown文件 -->
  <rect x="205" y="45" width="130" height="50" rx="8" fill="#fff" stroke="#667eea" stroke-width="2" filter="url(#shadow)"/>
  <text x="270" y="67" text-anchor="middle" fill="#333" font-size="13" font-weight="600">Markdown 文件</text>
  <text x="270" y="82" text-anchor="middle" fill="#888" font-size="10">知识库/ 目录</text>

  <!-- → -->
  <line x1="335" y1="70" x2="375" y2="70" stroke="#667eea" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Memsearch 扫描+分块 -->
  <rect x="380" y="45" width="150" height="50" rx="8" fill="#fff" stroke="#667eea" stroke-width="2" filter="url(#shadow)"/>
  <text x="455" y="67" text-anchor="middle" fill="#333" font-size="13" font-weight="600">Memsearch 分块</text>
  <text x="455" y="82" text-anchor="middle" fill="#888" font-size="10">按标题切 Chunk</text>

  <!-- → -->
  <line x1="530" y1="70" x2="570" y2="70" stroke="#667eea" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- ONNX 向量化 -->
  <rect x="575" y="45" width="150" height="50" rx="8" fill="url(#gBlue)" filter="url(#shadow)"/>
  <text x="650" y="67" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">ONNX bge-m3</text>
  <text x="650" y="82" text-anchor="middle" fill="#ddd" font-size="10">本地向量化 (CPU)</text>

  <!-- → -->
  <line x1="725" y1="70" x2="765" y2="70" stroke="#667eea" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Milvus 存储 -->
  <rect x="770" y="40" width="160" height="60" rx="8" fill="#fff" stroke="#667eea" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="850" y="62" text-anchor="middle" fill="#333" font-size="13" font-weight="700">Milvus Lite</text>
  <text x="850" y="78" text-anchor="middle" fill="#888" font-size="10">向量索引 + BM25索引</text>
  <text x="850" y="92" text-anchor="middle" fill="#aaa" font-size="9">嵌入式，零部署</text>

  <!-- ═══ 搜索流程 (中部) ═══ -->
  <text x="30" y="150" font-size="14" font-weight="bold" fill="#11998e">B. 语义搜索流程</text>

  <!-- 用户查询 -->
  <rect x="30" y="165" width="130" height="50" rx="8" fill="url(#gGreen)" filter="url(#shadow)"/>
  <text x="95" y="187" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">用户查询</text>
  <text x="95" y="202" text-anchor="middle" fill="#ddd" font-size="10">"分布式一致性"</text>

  <!-- → -->
  <line x1="160" y1="190" x2="200" y2="190" stroke="#11998e" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- 查询向量化 -->
  <rect x="205" y="165" width="130" height="50" rx="8" fill="#fff" stroke="#11998e" stroke-width="2" filter="url(#shadow)"/>
  <text x="270" y="187" text-anchor="middle" fill="#333" font-size="13" font-weight="600">查询向量化</text>
  <text x="270" y="202" text-anchor="middle" fill="#888" font-size="10">ONNX bge-m3</text>

  <!-- 分叉成两路 -->
  <line x1="335" y1="180" x2="395" y2="165" stroke="#11998e" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="335" y1="200" x2="395" y2="215" stroke="#11998e" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- 密集向量搜索 -->
  <rect x="400" y="140" width="160" height="40" rx="6" fill="#e8f5e9" stroke="#11998e" stroke-width="1.5"/>
  <text x="480" y="163" text-anchor="middle" fill="#1b5e20" font-size="12" font-weight="600">密集向量余弦搜索</text>

  <!-- BM25 稀疏搜索 -->
  <rect x="400" y="195" width="160" height="40" rx="6" fill="#e8f5e9" stroke="#11998e" stroke-width="1.5"/>
  <text x="480" y="218" text-anchor="middle" fill="#1b5e20" font-size="12" font-weight="600">BM25 稀疏搜索</text>

  <!-- 两路合并 → RRF -->
  <line x1="560" y1="160" x2="620" y2="185" stroke="#11998e" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="560" y1="215" x2="620" y2="195" stroke="#11998e" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- RRF 融合 -->
  <rect x="625" y="170" width="120" height="45" rx="8" fill="url(#gGreen)" filter="url(#shadow)"/>
  <text x="685" y="190" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">RRF 融合</text>
  <text x="685" y="205" text-anchor="middle" fill="#ddd" font-size="10">排序合并</text>

  <!-- → -->
  <line x1="745" y1="192" x2="785" y2="192" stroke="#11998e" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- 优先级加权 -->
  <rect x="790" y="165" width="140" height="50" rx="8" fill="#fff" stroke="#f093fb" stroke-width="2" filter="url(#shadow)"/>
  <text x="860" y="185" text-anchor="middle" fill="#333" font-size="12" font-weight="600">优先级加权</text>
  <text x="860" y="200" text-anchor="middle" fill="#888" font-size="10">score × (1+P×0.1)</text>

  <!-- ═══ 面试+评分流程 (中下部) ═══ -->
  <text x="30" y="280" font-size="14" font-weight="bold" fill="#e94560">C. AI 模拟面试流程</text>

  <!-- 开始面试 -->
  <rect x="30" y="295" width="130" height="50" rx="8" fill="url(#gOrange)" filter="url(#shadow)"/>
  <text x="95" y="317" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">开始面试</text>
  <text x="95" y="332" text-anchor="middle" fill="#ddd" font-size="10">技术/行为/系统设计</text>

  <!-- → -->
  <line x1="160" y1="320" x2="200" y2="320" stroke="#e94560" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- LLM 提问 -->
  <rect x="205" y="295" width="130" height="50" rx="8" fill="#fff" stroke="#e94560" stroke-width="2" filter="url(#shadow)"/>
  <text x="270" y="317" text-anchor="middle" fill="#333" font-size="13" font-weight="600">LLM 提问</text>
  <text x="270" y="332" text-anchor="middle" fill="#888" font-size="10">MiniMax / OpenAI</text>

  <!-- → -->
  <line x1="335" y1="320" x2="375" y2="320" stroke="#e94560" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- 用户回答 -->
  <rect x="380" y="295" width="120" height="50" rx="8" fill="#fce4ec" stroke="#e94560" stroke-width="1.5"/>
  <text x="440" y="317" text-anchor="middle" fill="#333" font-size="13" font-weight="600">用户回答</text>
  <text x="440" y="332" text-anchor="middle" fill="#888" font-size="10">候选人输入</text>

  <!-- → 两路 -->
  <line x1="500" y1="310" x2="555" y2="300" stroke="#e94560" stroke-width="2" marker-end="url(#arrow-red)"/>
  <line x1="500" y1="330" x2="555" y2="345" stroke="#11998e" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- 知识库召回 -->
  <rect x="560" y="325" width="140" height="45" rx="8" fill="#e8f5e9" stroke="#11998e" stroke-width="2" filter="url(#shadow)"/>
  <text x="630" y="345" text-anchor="middle" fill="#1b5e20" font-size="12" font-weight="600">知识库召回 Top3</text>
  <text x="630" y="360" text-anchor="middle" fill="#888" font-size="10">语义搜索相关内容</text>

  <!-- LLM 评分 -->
  <rect x="560" y="275" width="140" height="45" rx="8" fill="url(#gOrange)" filter="url(#shadow)"/>
  <text x="630" y="295" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">LLM 评分</text>
  <text x="630" y="310" text-anchor="middle" fill="#ddd" font-size="10">1-5分 + 优缺点</text>

  <!-- 知识库→LLM -->
  <line x1="630" y1="325" x2="630" y2="320" stroke="#11998e" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="680" y="335" font-size="9" fill="#888">注入 prompt</text>

  <!-- → 输出 -->
  <line x1="700" y1="297" x2="755" y2="297" stroke="#e94560" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- 评分结果 -->
  <rect x="760" y="275" width="160" height="45" rx="8" fill="#fff" stroke="#e94560" stroke-width="2" filter="url(#shadow)"/>
  <text x="840" y="295" text-anchor="middle" fill="#333" font-size="12" font-weight="600">评分 + 追问/换题</text>
  <text x="840" y="310" text-anchor="middle" fill="#888" font-size="10">含知识库 chunk_hash</text>

  <!-- ═══ 反馈闭环 (底部) ═══ -->
  <text x="30" y="420" font-size="14" font-weight="bold" fill="#f5576c">D. 反馈闭环（核心创新）</text>

  <!-- 反馈流程框 -->
  <rect x="30" y="435" width="900" height="120" rx="12" fill="#fff9fb" stroke="#f5576c" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- 用户标记 -->
  <rect x="55" y="455" width="140" height="50" rx="8" fill="url(#gYellow)" filter="url(#shadow)"/>
  <text x="125" y="477" text-anchor="middle" fill="#333" font-size="12" font-weight="600">用户标记</text>
  <text x="125" y="492" text-anchor="middle" fill="#555" font-size="10">有用 👍 / 没用 👎</text>

  <!-- → -->
  <line x1="195" y1="480" x2="245" y2="480" stroke="#f5576c" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- 定位源文件 -->
  <rect x="250" y="455" width="140" height="50" rx="8" fill="#fff" stroke="#f5576c" stroke-width="1.5"/>
  <text x="320" y="477" text-anchor="middle" fill="#333" font-size="12" font-weight="600">定位 Markdown</text>
  <text x="320" y="492" text-anchor="middle" fill="#888" font-size="10">通过 chunk_hash</text>

  <!-- → -->
  <line x1="390" y1="480" x2="440" y2="480" stroke="#f5576c" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- 修改优先级 -->
  <rect x="445" y="455" width="150" height="50" rx="8" fill="#fff" stroke="#f5576c" stroke-width="1.5"/>
  <text x="520" y="477" text-anchor="middle" fill="#333" font-size="12" font-weight="600">修改优先级</text>
  <text x="520" y="492" text-anchor="middle" fill="#888" font-size="10">有用+0.5 / 没用-1.0</text>

  <!-- → -->
  <line x1="595" y1="480" x2="645" y2="480" stroke="#f5576c" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- 重新索引 -->
  <rect x="650" y="455" width="120" height="50" rx="8" fill="#fff" stroke="#f5576c" stroke-width="1.5"/>
  <text x="710" y="477" text-anchor="middle" fill="#333" font-size="12" font-weight="600">重新索引</text>
  <text x="710" y="492" text-anchor="middle" fill="#888" font-size="10">Memsearch</text>

  <!-- → -->
  <line x1="770" y1="480" x2="805" y2="480" stroke="#f5576c" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- 排序变化 -->
  <rect x="810" y="450" width="110" height="60" rx="8" fill="url(#gYellow)" filter="url(#shadow)"/>
  <text x="865" y="477" text-anchor="middle" fill="#333" font-size="12" font-weight="700">排序提升</text>
  <text x="865" y="492" text-anchor="middle" fill="#555" font-size="10">下次搜索生效</text>

  <!-- 回到搜索的弧线箭头 -->
  <path d="M865,450 Q865,250 860,215" fill="none" stroke="#f5576c" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>
  <text x="885" y="350" font-size="10" fill="#f5576c" transform="rotate(-90,885,350)">反馈影响搜索排序</text>

  <!-- ═══ 底部技术栈标签 ═══ -->
  <rect x="30" y="580" width="900" height="55" rx="8" fill="#f5f5f5"/>
  <text x="55" y="600" font-size="11" fill="#555" font-weight="600">技术栈：</text>

  <rect x="120" y="588" width="70" height="22" rx="4" fill="#667eea"/><text x="155" y="603" text-anchor="middle" fill="#fff" font-size="10">FastAPI</text>
  <rect x="198" y="588" width="85" height="22" rx="4" fill="#667eea"/><text x="240" y="603" text-anchor="middle" fill="#fff" font-size="10">Memsearch</text>
  <rect x="291" y="588" width="85" height="22" rx="4" fill="#764ba2"/><text x="333" y="603" text-anchor="middle" fill="#fff" font-size="10">Milvus Lite</text>
  <rect x="384" y="588" width="90" height="22" rx="4" fill="#764ba2"/><text x="429" y="603" text-anchor="middle" fill="#fff" font-size="10">ONNX bge-m3</text>
  <rect x="482" y="588" width="55" height="22" rx="4" fill="#11998e"/><text x="509" y="603" text-anchor="middle" fill="#fff" font-size="10">BM25</text>
  <rect x="545" y="588" width="45" height="22" rx="4" fill="#11998e"/><text x="567" y="603" text-anchor="middle" fill="#fff" font-size="10">RRF</text>
  <rect x="598" y="588" width="80" height="22" rx="4" fill="#e94560"/><text x="638" y="603" text-anchor="middle" fill="#fff" font-size="10">LLM API</text>
  <rect x="686" y="588" width="55" height="22" rx="4" fill="#f5576c"/><text x="713" y="603" text-anchor="middle" fill="#fff" font-size="10">SM-2</text>
  <rect x="749" y="588" width="100" height="22" rx="4" fill="#fda085"/><text x="799" y="603" text-anchor="middle" fill="#333" font-size="10">faster-whisper</text>

  <!-- 标注：零成本 -->
  <text x="55" y="625" font-size="10" fill="#888">* 向量化、搜索、闪卡复习全程本地运行，零 API 调用成本。仅 LLM 面试模拟需调用外部 API（按量计费，~0.1元/次）。</text>

  <!-- ═══ 数据流标注 ═══ -->
  <rect x="30" y="650" width="900" height="55" rx="8" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="55" y="670" font-size="11" fill="#555" font-weight="600">数据存储：</text>
  <text x="130" y="670" font-size="11" fill="#333">知识库 → Markdown 文件（数据源） + Milvus 向量索引（派生，可重建）</text>
  <text x="130" y="688" font-size="11" fill="#333">闪卡 → cards.json（SM-2 状态机）  |  面试会话 → {session_id}.json（对话历史+评分）</text>
  <text x="130" y="706" font-size="11" fill="#888">全部本地文件存储，无需 MySQL/Redis/云数据库。Markdown 是唯一数据源，其余均为派生。</text>
</svg>
</body>
</html>
