[project]
name = "mianbi"
version = "0.2.0"
description = "Mianbi: evidence-grounded interview training with persistent learning memory"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "memsearch[onnx]>=0.3.1",
    "jieba>=0.42",
    "openai>=1.0",
]

[project.optional-dependencies]
speech = ["funasr>=1.1", "modelscope>=1.0", "torch", "torchaudio"]
claude = ["anthropic>=0.34"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
